<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="OVERSEER Neon Siege teaser">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070d1b"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ringA { animation: spinA 10s linear infinite; transform-origin: 640px 392px; }
      .ringB { animation: spinB 6s linear infinite; transform-origin: 640px 392px; }
      .player { animation: pulse 1.4s ease-in-out infinite; transform-origin: 640px 330px; }
      .boss { animation: threat 1.9s ease-in-out infinite; transform-origin: 930px 204px; }
      .textGlow { animation: flicker 2.4s ease-in-out infinite; }
      @keyframes spinA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinB { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes threat { 0%,100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.82; } }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g class="ringA">
    <circle cx="640" cy="392" r="228" fill="none" stroke="#13324b" stroke-width="5"/>
    <circle cx="640" cy="392" r="205" fill="none" stroke="#31f5ff" stroke-opacity="0.32" stroke-width="3"/>
  </g>
  <g class="ringB">
    <circle cx="640" cy="392" r="184" fill="none" stroke="#ff648f" stroke-opacity="0.26" stroke-width="3" stroke-dasharray="14 18"/>
  </g>
  <g class="player" filter="url(#glow)">
    <path d="M640 276 l40 16 10 42 -50 72 -50 -72 10 -42z" fill="#31f5ff"/>
    <rect x="584" y="322" width="112" height="14" rx="7" fill="#96ff47"/>
    <circle cx="640" cy="312" r="16" fill="#ffffff"/>
  </g>
  <g class="boss" filter="url(#glow)">
    <circle cx="930" cy="204" r="40" fill="#9bf7ff"/>
    <circle cx="930" cy="204" r="74" fill="none" stroke="#9bf7ff" stroke-width="10" stroke-opacity="0.58"/>
    <rect x="914" y="238" width="32" height="82" rx="10" fill="#9bf7ff"/>
  </g>
  <text class="textGlow" x="86" y="190" fill="#f4f8ff" font-family="Orbitron, Bahnschrift, sans-serif" font-size="108" font-weight="800" letter-spacing="10">OVERSEER</text>
  <text class="textGlow" x="90" y="266" fill="#31f5ff" font-family="Orbitron, Bahnschrift, sans-serif" font-size="68" font-weight="700" letter-spacing="8">NEON SIEGE</text>
  <text x="92" y="344" fill="#ffb84a" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="28" letter-spacing="3">Legendary modules / sentry crossfire / phase-shift boss / one more run loop</text>
  <text x="92" y="396" fill="#cfd8e9" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="34">Break the shell. Push deeper. One more run.</text>
</svg>
