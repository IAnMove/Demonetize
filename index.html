<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>DEMONETIZED: The Authenticity Purge</title>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("portal") === "true") {
          document.documentElement.dataset.portal = "true";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: #050811;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background:
          linear-gradient(138deg, rgba(255, 91, 127, 0.14), transparent 46%),
          linear-gradient(32deg, rgba(49, 245, 255, 0.1), transparent 58%),
          linear-gradient(180deg, #050811 0%, #03040a 100%);
        color: #edf4ff;
        font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .boot-intro {
        position: fixed;
        inset: 0;
        display: grid;
        align-items: center;
        padding: clamp(1.2rem, 4vw, 4rem);
        background:
          linear-gradient(rgba(49, 245, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 91, 127, 0.08) 1px, transparent 1px),
          linear-gradient(146deg, rgba(49, 245, 255, 0.08), transparent 44%),
          linear-gradient(28deg, rgba(255, 184, 74, 0.12), transparent 52%),
          linear-gradient(90deg, rgba(2, 4, 9, 0.95), rgba(2, 4, 9, 0.42), rgba(2, 4, 9, 0.86)),
          url("/promo/tope-cover-light.webp") center / cover no-repeat;
        background-size:
          4rem 4rem,
          4rem 4rem,
          auto,
          auto,
          auto,
          auto;
      }

      .boot-intro::before,
      .boot-intro::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .boot-intro::before {
        background:
          linear-gradient(118deg, rgba(49, 245, 255, 0.14), transparent 34%),
          linear-gradient(252deg, rgba(255, 91, 127, 0.12), transparent 42%);
      }

      .boot-intro::after {
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 7px
        );
        opacity: 0.42;
      }

      html[data-portal="true"] .boot-intro {
        display: none;
        background-image: none;
      }

      .boot-intro-panel {
        position: relative;
        z-index: 1;
        width: min(64rem, 100%);
        text-shadow: 0 0 28px rgba(49, 245, 255, 0.2);
        animation: boot-reveal 900ms ease-out both;
      }

      .boot-intro-kicker {
        display: block;
        margin-bottom: 1.1rem;
        color: #ffb84a;
        font-size: clamp(0.72rem, 1.3vw, 0.95rem);
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .boot-intro-copy {
        max-width: 58rem;
        margin: 0;
        color: #f5fbff;
        font-size: clamp(1.32rem, 4.3vw, 3.9rem);
        font-weight: 900;
        line-height: 1.12;
        text-transform: uppercase;
      }

      .boot-intro-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.8rem;
      }

      .boot-intro-status {
        display: inline-flex;
        align-items: center;
        min-height: 2.6rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(255, 184, 74, 0.36);
        border-radius: 0.7rem;
        color: #fff0cb;
        background: rgba(7, 10, 25, 0.72);
        box-shadow: 0 0 22px rgba(255, 184, 74, 0.14);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .boot-intro-start {
        min-height: 2.6rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(49, 245, 255, 0.38);
        border-radius: 0.7rem;
        color: #c9faff;
        background: rgba(49, 245, 255, 0.12);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
        opacity: 0.72;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }

      .boot-progress {
        display: grid;
        gap: 0.52rem;
        width: min(34rem, 100%);
        margin-top: 1.05rem;
      }

      .boot-progress-track {
        position: relative;
        display: block;
        height: 0.7rem;
        overflow: hidden;
        border: 1px solid rgba(49, 245, 255, 0.3);
        border-radius: 999px;
        background:
          linear-gradient(90deg, rgba(49, 245, 255, 0.1), rgba(255, 91, 127, 0.08)),
          rgba(2, 5, 14, 0.78);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04),
          0 0 24px rgba(49, 245, 255, 0.16),
          inset 0 0 18px rgba(0, 0, 0, 0.42);
      }

      .boot-progress-track::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 1.4rem,
          rgba(255, 255, 255, 0.16) 1.4rem 1.45rem
        );
        opacity: 0.55;
      }

      .boot-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #31f5ff, #b7ff57 48%, #ff5b7f);
        box-shadow:
          0 0 18px rgba(49, 245, 255, 0.65),
          0 0 26px rgba(255, 91, 127, 0.36);
        animation: boot-progress-scan 1.35s ease-in-out infinite;
      }

      .boot-progress-readout {
        color: #9cf8ff;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(49, 245, 255, 0.28);
      }

      @keyframes boot-reveal {
        from {
          opacity: 0;
          transform: translateY(1.2rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(49, 245, 255, 0.12);
        }
        50% {
          box-shadow: 0 0 24px rgba(49, 245, 255, 0.28);
        }
      }

      @keyframes boot-progress-scan {
        0% {
          transform: translateX(0);
          width: 24%;
        }
        48% {
          transform: translateX(72%);
          width: 64%;
        }
        100% {
          transform: translateX(228%);
          width: 34%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-intro-panel,
        .boot-intro-start,
        .boot-progress-fill {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (max-width: 640px) {
        .boot-intro {
          align-items: end;
          padding-bottom: 4rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="boot-intro" aria-live="polite">
        <div class="boot-intro-panel">
          <span
            class="boot-intro-kicker"
            data-boot-en="DEMONETIZED: The Authenticity Purge // 2026"
            data-boot-es="DEMONETIZED: The Authenticity Purge // 2026"
          >DEMONETIZED: The Authenticity Purge // 2026</span>
          <p
            class="boot-intro-copy"
            data-boot-en="It's not your channel. It's TheirTube. T.O.P.E. is loading the authenticity purge contract."
            data-boot-es="No es tu canal. Es TheirTube. T.O.P.E. esta cargando el contrato de purga de autenticidad."
          >It's not your channel. It's TheirTube. T.O.P.E. is loading the authenticity purge contract.</p>
          <div class="boot-intro-actions">
            <span
              class="boot-intro-status"
              data-boot-en="Loading purge contract"
              data-boot-es="Cargando contrato de purga"
            >Loading purge contract</span>
            <button
              class="boot-intro-start"
              type="button"
              disabled
              data-boot-en="Contract locked"
              data-boot-es="Contrato bloqueado"
            >Contract locked</button>
          </div>
          <div
            class="boot-progress"
            role="progressbar"
            aria-label="Loading contract"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="boot-progress-track">
              <span class="boot-progress-fill"></span>
            </span>
            <span
              class="boot-progress-readout"
              data-boot-en="Authenticating CEO contract stream"
              data-boot-es="Autenticando stream del contrato del CEO"
            >Authenticating CEO contract stream</span>
          </div>
        </div>
      </section>
    </div>
    <script>
      (() => {
        const stored = window.localStorage.getItem("overseer.locale");
        const locale = (stored || "en").toLowerCase().startsWith("es")
          ? "es"
          : "en";
        document.documentElement.lang = locale;
        document.querySelectorAll("[data-boot-en]").forEach((node) => {
          const key = locale === "es" ? "bootEs" : "bootEn";
          node.textContent = node.dataset[key] || node.textContent;
        });
      })();
    </script>
    <script async src="https://vibej.am/2026/widget.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
